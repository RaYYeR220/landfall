[package]
name = "landfall"
version = "0.2.0"
description = "Deposit addresses that execute on Solana: any-chain deposits land as shares of a curated USDC vault"
edition.workspace = true
rust-version.workspace = true
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "landfall"

[features]
default = []
no-entrypoint = []

[dependencies]
pinocchio = { version = "0.12.0", features = ["cpi"] }
pinocchio-token = "0.8.0"
pinocchio-system = "0.7.0"
pinocchio-associated-token-account = "0.5.0"
solana-address = { version = "2.9", features = ["decode"] }

[dev-dependencies]
anchor-lang = "1.2.2"
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
